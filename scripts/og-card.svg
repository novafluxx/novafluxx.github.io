<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="orbA" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="88%" cy="78%" r="38%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="72%" cy="18%" r="28%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#orbA)"/>
  <rect width="100%" height="100%" fill="url(#orbB)"/>
  <rect width="100%" height="100%" fill="url(#orbC)"/>

  <!-- Subtle grid -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="630"/><line x1="112" y1="0" x2="112" y2="630"/><line x1="184" y1="0" x2="184" y2="630"/><line x1="256" y1="0" x2="256" y2="630"/><line x1="328" y1="0" x2="328" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="472" y1="0" x2="472" y2="630"/><line x1="544" y1="0" x2="544" y2="630"/><line x1="616" y1="0" x2="616" y2="630"/><line x1="688" y1="0" x2="688" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/><line x1="832" y1="0" x2="832" y2="630"/><line x1="904" y1="0" x2="904" y2="630"/><line x1="976" y1="0" x2="976" y2="630"/><line x1="1048" y1="0" x2="1048" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="30" x2="1200" y2="30"/><line x1="0" y1="102" x2="1200" y2="102"/><line x1="0" y1="174" x2="1200" y2="174"/><line x1="0" y1="246" x2="1200" y2="246"/><line x1="0" y1="318" x2="1200" y2="318"/><line x1="0" y1="390" x2="1200" y2="390"/><line x1="0" y1="462" x2="1200" y2="462"/><line x1="0" y1="534" x2="1200" y2="534"/><line x1="0" y1="606" x2="1200" y2="606"/>
  </g>

  <!-- Constellation dots + a few connecting lines -->
  <g opacity="0.55">
    <circle cx="140" cy="120" r="2.2" fill="#e2e8f0"/><circle cx="210" cy="180" r="1.6" fill="#e2e8f0"/><circle cx="280" cy="110" r="1.8" fill="#e2e8f0"/><circle cx="980" cy="140" r="2" fill="#e2e8f0"/><circle cx="1040" cy="220" r="1.5" fill="#e2e8f0"/><circle cx="920" cy="260" r="1.4" fill="#e2e8f0"/><circle cx="1080" cy="480" r="1.8" fill="#e2e8f0"/><circle cx="980" cy="520" r="1.5" fill="#e2e8f0"/><circle cx="160" cy="500" r="1.6" fill="#e2e8f0"/><circle cx="220" cy="560" r="1.3" fill="#e2e8f0"/><circle cx="760" cy="90" r="1.4" fill="#e2e8f0"/><circle cx="820" cy="150" r="1.2" fill="#e2e8f0"/>
    <g stroke="#a78bfa" stroke-width="1" opacity="0.45" fill="none">
      <path d="M140 120 L210 180 L280 110"/>
      <path d="M980 140 L1040 220 L920 260"/>
      <path d="M160 500 L220 560"/>
      <path d="M760 90 L820 150"/>
    </g>
  </g>

  <!-- Soft frame -->
  <rect x="28" y="28" width="1144" height="574" rx="28" fill="none"
        stroke="rgba(148,163,184,0.18)" stroke-width="1.5"/>

  <!-- Accent bar -->
  <rect x="88" y="168" width="72" height="6" rx="3" fill="url(#bar)" filter="url(#softGlow)"/>

  <!-- Kicker -->
  <text x="88" y="218"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="600" letter-spacing="4.5"
        fill="#a78bfa">QUALITY  ·  AUTOMATION  ·  AVIATION</text>

  <!-- Name -->
  <text x="88" y="338"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="92" font-weight="700" letter-spacing="-2.5"
        fill="url(#nameGrad)">Justin High</text>

  <!-- Role -->
  <text x="88" y="418"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="36" font-weight="600" letter-spacing="-0.6"
        fill="#cbd5e1">Quality Engineer &amp; Automation Builder</text>

  <!-- Decorative corner marks -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M52 72 L52 52 L72 52"/>
    <path d="M1148 72 L1148 52 L1128 52"/>
    <path d="M52 558 L52 578 L72 578"/>
    <path d="M1148 558 L1148 578 L1128 578"/>
  </g>
